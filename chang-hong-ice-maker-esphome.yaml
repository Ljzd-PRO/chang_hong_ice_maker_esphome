  - platform: template
    id: chang_hong_ice_maker_esphome_p1_raw
    name: P1 Raw
    icon: mdi:sine-wave
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      return id(chang_hong_ice_maker_esphome_core).raw_p1();

  - platform: template
    id: chang_hong_ice_maker_esphome_p2_raw
    name: P2 Raw
    icon: mdi:sine-wave
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 5s
