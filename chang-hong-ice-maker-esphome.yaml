substitutions:
  name: chang-hong-ice-maker-esphome
  friendly_name: Chang Hong Ice Maker ESPHome
  project_version: "0.1.0"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: >-
    ESP32-C3 direct GPIO bridge for the five-wire ice-maker panel.
    Author: Ljzd-PRO <me@ljzd.link> https://github.com/Ljzd-PRO
  project:
    name: "ljzd-pro.chang_hong_ice_maker_esphome"
    version: ${project_version}
  platformio_options:
    build_flags:
      - -DARDUINO_USB_MODE=1
      - -DARDUINO_USB_CDC_ON_BOOT=1

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:
  baud_rate: 921600
  level: DEBUG
  logs:
    sensor: WARN
    text_sensor: WARN
    binary_sensor: WARN

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ChangHongIceMakerESPHome AP
    password: !secret fallback_ap_password

captive_portal:

esp32_improv:
  authorizer: none
  wifi_timeout: 90s
  on_start:
    then:
      - logger.log:
          level: INFO
          tag: improv
          format: "BLE Wi-Fi provisioning started"
  on_provisioning:
    then:
      - logger.log:
          level: INFO
          tag: improv
          format: "BLE Wi-Fi provisioning credentials received"
  on_provisioned:
    then:
      - logger.log:
          level: INFO
          tag: improv
          format: "BLE Wi-Fi provisioning completed"
  on_stop:
    then:
      - logger.log:
          level: INFO
          tag: improv
          format: "BLE Wi-Fi provisioning stopped"

external_components:
  - source:
      type: local
      path: components
    components:
      - chang_hong_ice_maker_esphome

chang_hong_ice_maker_esphome:
  id: chang_hong_ice_maker_esphome_core

select:
  - platform: template
    id: chang_hong_ice_maker_esphome_mode
    name: Mode
    icon: mdi:snowflake
    options:
      - "Off"
      - "Small Ice"
      - "Large Ice"
    update_interval: 1s
    lambda: |-
      if (id(chang_hong_ice_maker_esphome_core).mode_known()) {
        const auto mode = id(chang_hong_ice_maker_esphome_core).mode_text();
        if (!mode.empty()) {
          return mode;
        }
      }
      return {};
    set_action:
      - lambda: |-
          id(chang_hong_ice_maker_esphome_core).request_mode(x.str());

button:
  - platform: template
    id: chang_hong_ice_maker_esphome_uv_toggle
    name: UV Toggle
    icon: mdi:lightbulb-on-outline
    on_press:
      - lambda: |-
          id(chang_hong_ice_maker_esphome_core).request_uv_toggle();

binary_sensor:
  - platform: template
    id: chang_hong_ice_maker_esphome_action_busy
    name: Action Busy
    icon: mdi:progress-clock
    entity_category: diagnostic
    lambda: |-
      return id(chang_hong_ice_maker_esphome_core).action_busy();

text_sensor:
  - platform: template
    id: chang_hong_ice_maker_esphome_firmware_version
    name: Firmware Version
    icon: mdi:tag-outline
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return {"${project_version}"};

  - platform: version
    id: chang_hong_ice_maker_esphome_esphome_version
    name: ESPHome Version
    icon: mdi:chip
    entity_category: diagnostic
    hide_timestamp: true
    hide_hash: true

  - platform: template
    id: chang_hong_ice_maker_esphome_state
    name: State
    icon: mdi:state-machine
    update_interval: 1s
    lambda: |-
      return {id(chang_hong_ice_maker_esphome_core).state_text()};

  - platform: template
    id: chang_hong_ice_maker_esphome_classified_state
    name: Classified State
    icon: mdi:state-machine
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      return {id(chang_hong_ice_maker_esphome_core).classified_state_text()};

  - platform: template
    id: chang_hong_ice_maker_esphome_adc_signature
    name: ADC Signature
    icon: mdi:pulse
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      return {id(chang_hong_ice_maker_esphome_core).signature_text()};

  - platform: template
    id: chang_hong_ice_maker_esphome_action_state
    name: Action State
    icon: mdi:progress-clock
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      return {id(chang_hong_ice_maker_esphome_core).action_state_text()};

  - platform: template
    id: chang_hong_ice_maker_esphome_action_result
    name: Action Result
    icon: mdi:clipboard-pulse-outline
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      return {id(chang_hong_ice_maker_esphome_core).action_result_text()};

sensor:
  - platform: template
    id: chang_hong_ice_maker_esphome_confidence
    name: Confidence
    icon: mdi:checkbox-marked-circle-outline
    unit_of_measurement: "%"
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      return id(chang_hong_ice_maker_esphome_core).confidence();

  - platform: template
    id: chang_hong_ice_maker_esphome_blink_score
    name: Standby Blink Score
    icon: mdi:chart-sine
    unit_of_measurement: "%"
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      return id(chang_hong_ice_maker_esphome_core).blink_score();

  - platform: template
    id: chang_hong_ice_maker_esphome_ratio_large
    name: Ratio 0HHHH
    icon: mdi:chart-bar
    unit_of_measurement: "%"
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      return id(chang_hong_ice_maker_esphome_core).ratio_large_signature();

  - platform: template
    id: chang_hong_ice_maker_esphome_ratio_mhmhh
    name: Ratio MHMHH
    icon: mdi:chart-bar
    unit_of_measurement: "%"
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      return id(chang_hong_ice_maker_esphome_core).ratio_mhmhh_signature();

  - platform: template
    id: chang_hong_ice_maker_esphome_p1_raw
    name: P1 Raw
    icon: mdi:sine-wave
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      return id(chang_hong_ice_maker_esphome_core).raw_p1();

  - platform: template
    id: chang_hong_ice_maker_esphome_p2_raw
    name: P2 Raw
    icon: mdi:sine-wave
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      return id(chang_hong_ice_maker_esphome_core).raw_p2();

  - platform: template
    id: chang_hong_ice_maker_esphome_p3_raw
    name: P3 Raw
    icon: mdi:sine-wave
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      return id(chang_hong_ice_maker_esphome_core).raw_p3();

  - platform: template
    id: chang_hong_ice_maker_esphome_p4_raw
    name: P4 Raw
    icon: mdi:sine-wave
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      return id(chang_hong_ice_maker_esphome_core).raw_p4();

  - platform: template
    id: chang_hong_ice_maker_esphome_p5_raw
    name: P5 Raw
    icon: mdi:sine-wave
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      return id(chang_hong_ice_maker_esphome_core).raw_p5();
