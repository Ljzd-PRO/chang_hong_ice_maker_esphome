# ChangHongIceMakerESPHome
# Copyright (c) 2026 Ljzd-PRO <me@ljzd.link>
# Project: https://github.com/Ljzd-PRO

substitutions:
  name: chang-hong-ice-maker-esphome
  friendly_name: Chang Hong Ice Maker ESPHome
  project_version: "1.0.0"
  target_model: "CH-Z6Y3"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: >-
    ESP32-C3 direct GPIO bridge for the five-wire Chang Hong CH-Z6Y3 ice-maker panel.
    Author: Ljzd-PRO <me@ljzd.link> https://github.com/Ljzd-PRO
  project:
    name: "ljzd-pro.chang_hong_ice_maker_esphome"
    version: ${project_version}
  platformio_options:
    build_flags:
      - -DARDUINO_USB_MODE=1
      - -DARDUINO_USB_CDC_ON_BOOT=1

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:
  baud_rate: 921600
  level: DEBUG
  logs:
    sensor: WARN
    text_sensor: WARN
    binary_sensor: WARN

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ChangHongIceMakerESPHome AP
    password: !secret fallback_ap_password

captive_portal:

esp32_improv:
  authorizer: none
  wifi_timeout: 90s
  on_start:
    then:
      - logger.log:
          level: INFO
          tag: improv
          format: "BLE Wi-Fi provisioning started"
  on_provisioning:
    then:
      - logger.log:
          level: INFO
          tag: improv
          format: "BLE Wi-Fi provisioning credentials received"
  on_provisioned:
    then:
      - logger.log:
          level: INFO
          tag: improv
          format: "BLE Wi-Fi provisioning completed"
  on_stop:
    then:
      - logger.log:
          level: INFO
          tag: improv
          format: "BLE Wi-Fi provisioning stopped"

external_components:
  - source:
      type: local
      path: components
    components:
      - chang_hong_ice_maker_esphome

chang_hong_ice_maker_esphome:
  id: chang_hong_ice_maker_esphome_core

switch:
  - platform: template
    id: chang_hong_ice_maker_esphome_power
    name: Power
    icon: mdi:power
    lambda: |-
      if (id(chang_hong_ice_maker_esphome_core).power_known()) {
        return id(chang_hong_ice_maker_esphome_core).power_on();
      }
      return {};
    turn_on_action:
      - lambda: |-
          const bool accepted = id(chang_hong_ice_maker_esphome_core).request_power(true);
          if (accepted) {
            id(chang_hong_ice_maker_esphome_power).publish_state(true);
            id(chang_hong_ice_maker_esphome_large_ice).publish_state(true);
          } else if (id(chang_hong_ice_maker_esphome_core).power_known()) {
            id(chang_hong_ice_maker_esphome_power).publish_state(
                id(chang_hong_ice_maker_esphome_core).power_on());
          }
    turn_off_action:
      - lambda: |-
          const bool accepted = id(chang_hong_ice_maker_esphome_core).request_power(false);
          if (accepted) {
            id(chang_hong_ice_maker_esphome_power).publish_state(false);
            id(chang_hong_ice_maker_esphome_large_ice).publish_state(true);
          } else if (id(chang_hong_ice_maker_esphome_core).power_known()) {
            id(chang_hong_ice_maker_esphome_power).publish_state(
                id(chang_hong_ice_maker_esphome_core).power_on());
          }

  - platform: template
    id: chang_hong_ice_maker_esphome_large_ice
    name: Large Ice
    icon: mdi:snowflake
    lambda: |-
      if (id(chang_hong_ice_maker_esphome_core).power_known() &&
          !id(chang_hong_ice_maker_esphome_core).power_on()) {
        return true;
      }
      if (id(chang_hong_ice_maker_esphome_core).size_known()) {
        return id(chang_hong_ice_maker_esphome_core).large_ice();
      }
      return {};
    turn_on_action:
      - lambda: |-
          const bool accepted = id(chang_hong_ice_maker_esphome_core).request_large_ice(true);
          if (accepted) {
            id(chang_hong_ice_maker_esphome_large_ice).publish_state(true);
          } else if (id(chang_hong_ice_maker_esphome_core).power_known() &&
                     !id(chang_hong_ice_maker_esphome_core).power_on()) {
            id(chang_hong_ice_maker_esphome_large_ice).publish_state(true);
          } else if (id(chang_hong_ice_maker_esphome_core).size_known()) {
            id(chang_hong_ice_maker_esphome_large_ice).publish_state(
                id(chang_hong_ice_maker_esphome_core).large_ice());
          }
    turn_off_action:
      - lambda: |-
          const bool accepted = id(chang_hong_ice_maker_esphome_core).request_large_ice(false);
          if (accepted) {
            id(chang_hong_ice_maker_esphome_large_ice).publish_state(false);
          } else if (id(chang_hong_ice_maker_esphome_core).power_known() &&
                     !id(chang_hong_ice_maker_esphome_core).power_on()) {
            id(chang_hong_ice_maker_esphome_large_ice).publish_state(true);
          } else if (id(chang_hong_ice_maker_esphome_core).size_known()) {
            id(chang_hong_ice_maker_esphome_large_ice).publish_state(
                id(chang_hong_ice_maker_esphome_core).large_ice());
          }

button:
  - platform: template
    id: chang_hong_ice_maker_esphome_uv_toggle
    name: UV Toggle
    icon: mdi:lightbulb-on-outline
    on_press:
      - lambda: |-
          id(chang_hong_ice_maker_esphome_core).request_uv_toggle();

binary_sensor:
  - platform: template
    id: chang_hong_ice_maker_esphome_action_busy
    name: Action Busy
    icon: mdi:progress-clock
    entity_category: diagnostic
    lambda: |-
      return id(chang_hong_ice_maker_esphome_core).action_busy();

  - platform: template
    id: chang_hong_ice_maker_esphome_standby_window_valid
    name: Standby Window Valid
    icon: mdi:chart-timeline-variant
    entity_category: diagnostic
    lambda: |-
      return id(chang_hong_ice_maker_esphome_core).standby_window_valid();

text_sensor:
  - platform: template
    id: chang_hong_ice_maker_esphome_firmware_version
    name: Firmware Version
    icon: mdi:tag-outline
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return {"${project_version}"};

  - platform: template
    id: chang_hong_ice_maker_esphome_target_model
    name: Target Model
    icon: mdi:label-outline
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return {"${target_model}"};

  - platform: version
    id: chang_hong_ice_maker_esphome_esphome_version
    name: ESPHome Version
    icon: mdi:chip
    entity_category: diagnostic
    hide_timestamp: true
    hide_hash: true

  - platform: template
    id: chang_hong_ice_maker_esphome_state
    name: State
    icon: mdi:state-machine
    update_interval: 1s
    lambda: |-
      return {id(chang_hong_ice_maker_esphome_core).state_text()};

  - platform: template
    id: chang_hong_ice_maker_esphome_classified_state
    name: Classified State
    icon: mdi:state-machine
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      return {id(chang_hong_ice_maker_esphome_core).classified_state_text()};

  - platform: template
    id: chang_hong_ice_maker_esphome_fast_state_candidate
    name: Fast State Candidate
    icon: mdi:state-machine
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      return {id(chang_hong_ice_maker_esphome_core).fast_state_candidate_text()};

  - platform: template
    id: chang_hong_ice_maker_esphome_feature_state_candidate
    name: Feature State Candidate
    icon: mdi:state-machine
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      return {id(chang_hong_ice_maker_esphome_core).feature_state_candidate_text()};

  - platform: template
    id: chang_hong_ice_maker_esphome_adc_signature
    name: ADC Signature
    icon: mdi:pulse
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      return {id(chang_hong_ice_maker_esphome_core).signature_text()};

  - platform: template
    id: chang_hong_ice_maker_esphome_action_state
    name: Action State
    icon: mdi:progress-clock
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      return {id(chang_hong_ice_maker_esphome_core).action_state_text()};

  - platform: template
    id: chang_hong_ice_maker_esphome_action_result
    name: Action Result
    icon: mdi:clipboard-pulse-outline
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      return {id(chang_hong_ice_maker_esphome_core).action_result_text()};

sensor:
  - platform: template
    id: chang_hong_ice_maker_esphome_confidence
    name: Confidence
    icon: mdi:checkbox-marked-circle-outline
    unit_of_measurement: "%"
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      return id(chang_hong_ice_maker_esphome_core).confidence();

  - platform: template
    id: chang_hong_ice_maker_esphome_blink_score
    name: Standby Blink Score
    icon: mdi:chart-sine
    unit_of_measurement: "%"
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      return id(chang_hong_ice_maker_esphome_core).blink_score();

  - platform: template
    id: chang_hong_ice_maker_esphome_fast_ratio_large
    name: Fast Ratio 0HHHH
    icon: mdi:chart-bar
    unit_of_measurement: "%"
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      return id(chang_hong_ice_maker_esphome_core).ratio_large_signature();

  - platform: template
    id: chang_hong_ice_maker_esphome_fast_ratio_mhmhh
    name: Fast Ratio MHMHH
    icon: mdi:chart-bar
    unit_of_measurement: "%"
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      return id(chang_hong_ice_maker_esphome_core).ratio_mhmhh_signature();

  - platform: template
    id: chang_hong_ice_maker_esphome_small_feature_score
    name: Small Feature Score
    icon: mdi:counter
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      return id(chang_hong_ice_maker_esphome_core).small_feature_score();

  - platform: template
    id: chang_hong_ice_maker_esphome_standby_feature_score
    name: Standby Feature Score
    icon: mdi:counter
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      return id(chang_hong_ice_maker_esphome_core).standby_feature_score();

  - platform: template
    id: chang_hong_ice_maker_esphome_p2_stddev
    name: P2 StdDev
    icon: mdi:sigma
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      return id(chang_hong_ice_maker_esphome_core).p2_stddev();

  - platform: template
    id: chang_hong_ice_maker_esphome_delta_p2_p4
    name: Delta P2 P4
    icon: mdi:delta
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
