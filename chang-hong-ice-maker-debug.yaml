# Copyright (c) 2026 Ljzd-PRO <me@ljzd.link>
# Project: https://github.com/Ljzd-PRO

substitutions:
  name: chang-hong-ice-maker-debug
  friendly_name: Chang Hong Ice Maker Debug
  project_version: "1.0.1-debug"
  target_model: "CH-Z6Y3"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: >-
    Passive diagnostic firmware for the five-wire Chang Hong CH-Z6Y3 ice-maker panel.
    Author: Ljzd-PRO <me@ljzd.link> https://github.com/Ljzd-PRO
  project:
    name: "ljzd-pro.chang_hong_ice_maker_esphome_debug"
    version: ${project_version}
  platformio_options:
    build_flags:
      - -DARDUINO_USB_MODE=1
      - -DARDUINO_USB_CDC_ON_BOOT=1

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:
  baud_rate: 921600
  level: DEBUG
  logs:
    sensor: WARN
    text_sensor: WARN
    select: WARN
    button: WARN

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ChangHongIceMakerDebug AP
    password: !secret fallback_ap_password

captive_portal:

esp32_improv:
  authorizer: none
  wifi_timeout: 90s

external_components:
  - source:
      type: local
      path: components
    components:
      - chang_hong_ice_maker_panel_debug

chang_hong_ice_maker_panel_debug:
  id: panel_debug

select:
  - platform: template
    id: debug_bias_mode
    name: Bias Mode
    icon: mdi:electric-switch
    entity_category: diagnostic
    options:
      - Float
      - Internal Pullup
      - Internal Pulldown
    update_interval: 1s
    lambda: |-
      return {id(panel_debug).bias_mode_text()};
    set_action:
      - lambda: |-
          id(panel_debug).set_bias_mode(x);

button:
  - platform: template
    id: debug_restore_float
    name: Restore Floating Inputs
    icon: mdi:restore
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(panel_debug).set_bias_mode("Float");

text_sensor:
  - platform: template
    id: debug_firmware_version
    name: Firmware Version
    icon: mdi:tag-outline
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return {"${project_version}"};

  - platform: template
    id: debug_target_model
    name: Target Model
    icon: mdi:label-outline
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return {"${target_model}"};

  - platform: version
    id: debug_esphome_version
    name: ESPHome Version
    icon: mdi:chip
    entity_category: diagnostic
    hide_timestamp: true
    hide_hash: true

  - platform: template
    id: debug_bias_mode_text
    name: Bias Mode Text
    icon: mdi:electric-switch
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      return {id(panel_debug).bias_mode_text()};

  - platform: template
    id: debug_adc_signature
    name: ADC Signature
    icon: mdi:pulse
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      return {id(panel_debug).signature_text()};

  - platform: template
    id: debug_adc_backend
    name: ADC Backend
    icon: mdi:chip
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      return {id(panel_debug).adc_backend_text()};

  - platform: template
    id: debug_adc_calibration
    name: ADC Calibration
    icon: mdi:tune-variant
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      return {id(panel_debug).adc_calibration_text()};

  - platform: template
    id: debug_digital_mask
    name: Digital Mask
    icon: mdi:memory
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      return {id(panel_debug).digital_mask_text()};

sensor:
  - platform: template
    id: debug_sample_rate
    name: Sample Rate
    icon: mdi:speedometer
    unit_of_measurement: Hz
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      return id(panel_debug).sample_rate_hz();

  - platform: template
    id: debug_target_sample_rate
    name: Target Sample Rate
    icon: mdi:speedometer-medium
    unit_of_measurement: Hz
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 5s
